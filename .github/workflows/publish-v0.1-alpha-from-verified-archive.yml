name: Publish verified v0.1-alpha source release

on:
  push:
    branches: [ main ]
    paths:
      - '.release-stage/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source release
        shell: bash
        run: |
          set -euo pipefail
          test -f .release-stage/READY
          test "$(find .release-stage -maxdepth 1 -type f -name 'p4-*' | wc -l)" -eq 29
          for i in $(seq -w 0 27); do test "$(stat -c '%s' .release-stage/p4-$i)" -eq 4000; done
          test "$(stat -c '%s' .release-stage/p4-28)" -eq 1120
          cat .release-stage/p4-* > /tmp/mm-engine-public-release.tar.xz
          test "$(stat -c '%s' /tmp/mm-engine-public-release.tar.xz)" -eq 113120
          echo "252e860e9f8832cc2565f69dd06327eb39d0ecaff22cecb7583d864101d61ade  /tmp/mm-engine-public-release.tar.xz" | sha256sum -c -

          rm -rf /tmp/mm-engine-public-release
          mkdir -p /tmp/mm-engine-public-release
          tar -xJf /tmp/mm-engine-public-release.tar.xz -C /tmp/mm-engine-public-release

          # The compact staging archive omits two identical DejaVuSans copies.
          # Restore only after verifying the runner font is byte-identical to
          # the font recorded by the public release manifest.
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -f "$FONT"
          echo "ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280  $FONT" | sha256sum -c -
          install -D -m 0644 "$FONT" /tmp/mm-engine-public-release/samples/Hello2D/assets/DejaVuSans.ttf
          install -D -m 0644 "$FONT" /tmp/mm-engine-public-release/samples/InputDemo/assets/DejaVuSans.ttf

          test "$(find /tmp/mm-engine-public-release -type f | wc -l)" -eq 133
          test -f /tmp/mm-engine-public-release/README.md
          test -f /tmp/mm-engine-public-release/LICENSE
          test -f /tmp/mm-engine-public-release/.github/FUNDING.yml
          test -f /tmp/mm-engine-public-release/.github/workflows/ci.yml
          test -f /tmp/mm-engine-public-release/docs/MM_ENGINE_COMPLETE_BUILD_PACKAGING_AND_DIAGNOSTICS_GUIDE.txt
          test -d /tmp/mm-engine-public-release/src
          test -d /tmp/mm-engine-public-release/samples
          test -d /tmp/mm-engine-public-release/tools
          test -d /tmp/mm-engine-public-release/docs
          test ! -d /tmp/mm-engine-public-release/.bootstrap
          test ! -d /tmp/mm-engine-public-release/.release-stage

          cd /tmp/mm-engine-public-release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          manifest = Path('MANIFEST.sha256')
          entries = 0
          for line in manifest.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line:
                  continue
              digest, rel = line.split(None, 1)
              rel = rel.strip()
              if rel.startswith('./'):
                  rel = rel[2:]
              p = Path(rel)
              if not p.is_file():
                  raise SystemExit(f'manifest missing file: {rel}')
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'manifest mismatch: {rel}')
              entries += 1
          if entries != 132:
              raise SystemExit(f'expected 132 manifest entries, got {entries}')

          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8-sig'))

          for pattern in ('*.csproj', '*.props', '*.targets', '*.slnx'):
              for p in Path('.').rglob(pattern):
                  ET.fromstring(p.read_text(encoding='utf-8-sig'))

          forbidden = {'bin', 'obj', 'out', 'artifacts'}
          for p in Path('.').rglob('*'):
              if p.is_file() and any(part in forbidden for part in p.parts):
                  raise SystemExit(f'forbidden generated path: {p}')

          print('release static verification OK')
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test portable release
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mm-engine-public-release
          dotnet restore MMEngine.Portable.slnx
          dotnet build MMEngine.Portable.slnx -c Release --no-restore
          dotnet run --project tests/MMEngine.Tests/MMEngine.Tests.csproj -c Release --no-build

      - name: Publish repository tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/mm-engine-public-release/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          git commit -m 'Publish MM ENGINE v0.1-alpha public source release'
          git push origin HEAD:main
