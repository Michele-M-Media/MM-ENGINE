name: Finalize v0.1-alpha release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-v0.1-alpha-release.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Refresh manifest for release notes
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(sha256sum PUBLIC_RELEASE_NOTES.md | awk '{print $1}')"
          python3 - "$HASH" <<'PY'
          from pathlib import Path
          import sys
          new_hash = sys.argv[1]
          p = Path('MANIFEST.sha256')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          replaced = False
          for line in lines:
              if line.rstrip().endswith('  ./PUBLIC_RELEASE_NOTES.md'):
                  out.append(f'{new_hash}  ./PUBLIC_RELEASE_NOTES.md')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('PUBLIC_RELEASE_NOTES.md manifest entry not found')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Validate portable release
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MMEngine.Portable.slnx
          dotnet build MMEngine.Portable.slnx -c Release --no-restore
          dotnet run --project tests/MMEngine.Tests/MMEngine.Tests.csproj -c Release --no-build
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          bad = []
          count = 0
          for line in Path('MANIFEST.sha256').read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line:
                  continue
              digest, rel = line.split(None, 1)
              rel = rel.strip()
              if rel.startswith('./'):
                  rel = rel[2:]
              p = Path(rel)
              if not p.is_file():
                  bad.append(f'missing: {rel}')
                  continue
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != digest:
                  bad.append(f'hash mismatch: {rel}')
              count += 1
          if count != 132:
              bad.append(f'expected 132 manifest entries, got {count}')
          if bad:
              raise SystemExit('\n'.join(bad))
          print('Manifest OK: 132 entries')
          PY

      - name: Commit clean release metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v0.1-alpha-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 .github/workflows/finalize-v0.1-alpha-release.yml
          git commit -m 'Finalize v0.1-alpha release metadata'
          git push origin HEAD:main

      - name: Move release tag to finalized commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v0.1-alpha HEAD
          git push --force origin refs/tags/v0.1-alpha

      - name: Publish polished GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.1-alpha \
            --repo "$GITHUB_REPOSITORY" \
            --title '🚀 MM ENGINE v0.1-alpha — First Public Alpha' \
            --notes-file PUBLIC_RELEASE_NOTES.md \
            --prerelease
