name: Repair v0.1-alpha slim staging

on:
  push:
    branches: [ v0.1-alpha-publish-stage2 ]
    paths:
      - '.github/workflows/repair-slim-stage.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover one missing Base64 symbol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, multiprocessing as mp, os, time

          root = Path('.release-stage')
          names = ['slim-00','slim-01','slim-02','slim-03','slim-04','slim-05a','slim-05b','slim-05c','slim-05d']
          parts = {n: (root/n).read_bytes() for n in names}
          pre = parts['slim-00']
          bad = parts['slim-01']
          post = b''.join(parts[n] for n in names[2:])
          target = bytes.fromhex('5e6687d98270cdc43a7a17e8112c06b9b78a34f6425e514448c04e7d49431cae')
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          print('sizes:', {n: len(parts[n]) for n in names}, flush=True)
          combined = pre + bad + post
          print('combined chars:', len(combined), 'mod4:', len(combined)%4, flush=True)

          def valid_payload(encoded):
              try:
                  data = base64.b64decode(encoded, validate=True)
                  # XZ integrity is a very selective fast prefilter. Only a candidate
                  # that reconstructs a valid stream reaches the SHA-256 comparison.
                  lzma.decompress(data, format=lzma.FORMAT_XZ)
              except (ValueError, lzma.LZMAError):
                  return False
              return hashlib.sha256(data).digest() == target

          if len(combined) % 4 == 0:
              if valid_payload(combined):
                  print('payload already repaired', flush=True)
                  raise SystemExit(0)
              raise SystemExit('aligned payload is not the expected verified XZ archive')

          if len(combined) % 4 != 3 or len(bad) != 19999:
              raise SystemExit('unexpected staging shape; refusing blind repair')

          def test_pos(i):
              buf = bytearray(pre + bad[:i] + b'A' + bad[i:] + post)
              idx = len(pre) + i
              for c in alphabet:
                  buf[idx] = c
                  if valid_payload(buf):
                      return i, chr(c)
              return None

          # Boundaries first because transport truncation commonly lands there.
          likely = list(range(0, 32)) + list(range(max(0, len(bad)-32), len(bad)+1))
          for i in likely:
              hit = test_pos(i)
              if hit:
                  pos, ch = hit
                  print('FOUND boundary hit', hit, flush=True)
                  (root/'slim-01').write_bytes(bad[:pos] + ch.encode('ascii') + bad[pos:])
                  raise SystemExit(0)

          GLOBAL = {}
          def init_worker(pre_, bad_, post_, target_):
              GLOBAL['pre']=pre_; GLOBAL['bad']=bad_; GLOBAL['post']=post_; GLOBAL['target']=target_

          def search_range(bounds):
              start, end = bounds
              pre_ = GLOBAL['pre']; bad_ = GLOBAL['bad']; post_ = GLOBAL['post']; target_ = GLOBAL['target']
              for i in range(start, end):
                  if i % 500 == 0:
                      print(f'worker {os.getpid()} position {i}', flush=True)
                  buf = bytearray(pre_ + bad_[:i] + b'A' + bad_[i:] + post_)
                  idx = len(pre_) + i
                  for c in alphabet:
                      buf[idx] = c
                      try:
                          data = base64.b64decode(buf, validate=True)
                          lzma.decompress(data, format=lzma.FORMAT_XZ)
                      except (ValueError, lzma.LZMAError):
                          continue
                      if hashlib.sha256(data).digest() == target_:
                          return i, chr(c)
              return None

          # Split the insertion range over four independent workers.
          total = len(bad) + 1
          q = (total + 3) // 4
          ranges = [(i, min(i+q, total)) for i in range(0, total, q)]
          t0 = time.time()
          hit = None
          with mp.Pool(processes=min(4, len(ranges)), initializer=init_worker,
                       initargs=(pre,bad,post,target)) as pool:
              for result in pool.imap_unordered(search_range, ranges):
                  if result:
                      hit = result
                      pool.terminate()
                      break
          if not hit:
              raise SystemExit('no one-character repair matched the verified XZ/SHA-256 target')

          pos, ch = hit
          print('FOUND full-search hit', hit, 'seconds', time.time()-t0, flush=True)
          fixed = bad[:pos] + ch.encode('ascii') + bad[pos:]
          assert len(fixed) == 20000
          assert valid_payload(pre + fixed + post)
          (root/'slim-01').write_bytes(fixed)
          PY

          if ! git diff --quiet -- .release-stage/slim-01; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .release-stage/slim-01
            git commit -m 'Repair verified v0.1-alpha staging payload'
            git push origin HEAD:v0.1-alpha-publish-stage2
          else
            echo 'No repair commit needed.'
          fi
