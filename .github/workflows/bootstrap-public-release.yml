name: Bootstrap public release

on:
  push:
    paths:
      - '.bootstrap/p-035'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/p-* | base64 -d > /tmp/mm-engine-public-release.tar.gz
          echo "2afd827ab7cc1823538bd387ffd558960b7b6f2d015d82c8550500fe0bbed707  /tmp/mm-engine-public-release.tar.gz" | sha256sum -c -
          mkdir -p /tmp/mm-engine-public-release
          tar -xzf /tmp/mm-engine-public-release.tar.gz -C /tmp/mm-engine-public-release

      - name: Publish repository tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/mm-engine-public-release/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish MM ENGINE v0.1-alpha public release'
          git push origin HEAD:main
