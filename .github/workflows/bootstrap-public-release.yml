name: Bootstrap public release

on:
  push:
    paths:
      - '.bootstrap/public-release-en.tar.xz'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract public release
        shell: bash
        run: |
          set -euo pipefail
          echo "1c340acbf45f476360387972e2c5649104de6263b9eca73d5e8d99e6a0156d3d  .bootstrap/public-release-en.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mm-engine-public-release
          tar -xJf .bootstrap/public-release-en.tar.xz -C /tmp/mm-engine-public-release

      - name: Publish repository tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/mm-engine-public-release/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish MM ENGINE v0.1-alpha public release'
          git push origin HEAD:main
