name: Bootstrap public release

on:
  push:
    paths:
      - '.bootstrap/q-045'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/q-* | base64 -d > /tmp/mm-engine-public-release.tar.xz
          echo "4200a02c544dabbcf9e6c7be5f819e10a06aa95d7d2a9ff91c9cf1ee283c2b0b  /tmp/mm-engine-public-release.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mm-engine-public-release
          tar -xJf /tmp/mm-engine-public-release.tar.xz -C /tmp/mm-engine-public-release

      - name: Publish repository tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/mm-engine-public-release/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish MM ENGINE v0.1-alpha public release'
          git push origin HEAD:main
